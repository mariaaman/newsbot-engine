[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsbot"
version = "0.1.0"
description = "Automated, trustworthy, bilingual (bn/en) news engine"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "requests>=2.31",
  "trafilatura>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["newsbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
