# Deployed by .github/workflows/setup-dashboard.yml (it fills in the KV id and the variables). Secrets are never written here:
# DASHBOARD_PASSWORD, SESSION_SECRET, GH_TOKEN are Worker secrets set by the workflow.
name = "newsbot-dashboard"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[[kv_namespaces]]
binding = "KV"
id = "__KV_ID__"

[vars]
BRAIN_REPO = "OWNER/newsbot-brain"
ENGINE_REPO = "OWNER/newsbot-engine"
