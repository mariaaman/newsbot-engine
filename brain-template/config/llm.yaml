# LLM routing: ONLY Cloudflare Workers AI. Provider "workers_ai" in a chain means the POOL of every Cloudflare account
# added in the dashboard (tab "কী" -> "LLM অ্যাকাউন্ট"): any number, all used equally (least-used first, ties take turns).
# Chains are tried in order; when an account is out of allowance or fails, the next account takes over.
# A task whose answer fails the JSON schema twice moves to the next DIFFERENT model in its chain (20b -> 120b).
# Model IDs are checked on every account by `python -m newsbot health` and really tried by `llmcheck` (dashboard: "এখনই যাচাই").
# Free Workers AI allowance: 10,000 neurons per account per day (resets 00:00 UTC). Every ID and number below is # VERIFY.
llm:
  tasks: {extract: small, verify: strong, write_bn: strong, write_en: strong, qa_check: small}
  tiers:
    small:
      - {provider: workers_ai, model: "@cf/openai/gpt-oss-20b"}             # VERIFY: cheap model for extraction / checks
      - {provider: workers_ai, model: "@cf/openai/gpt-oss-120b"}            # VERIFY: takes over when 20b fails the schema
    strong:
      - {provider: workers_ai, model: "@cf/openai/gpt-oss-120b"}            # VERIFY: fact checking and article writing
  embedding: {provider: workers_ai, model: "@cf/baai/bge-m3"}                # VERIFY multilingual (bn) support
  budget:
    stop_fraction: 0.9                  # an account stops at 90% of its daily allowance; the next account takes over
    neurons_per_day_per_account: 10000  # VERIFY: Cloudflare free allowance of EACH account (set higher on a paid account, 0 = no limit)
    neurons_per_day: {}                 # per-account override, key = cf_<label in lower case>, e.g. cf_phone1: 50000
    tokens_per_day: {}                  # optional extra limits by tokens or requests: key = cf_<label> or cf_<label>/<model>
    requests_per_day: {}
  # Neurons per MILLION tokens (from Cloudflare's price list: dollars per million tokens / 0.000011). VERIFY.
  # A model that is not listed is counted at the "default" rate (the dearest, so the allowance is never under-counted).
  neuron_rates:
    "@cf/openai/gpt-oss-120b": {in: 31818, out: 68182}
    "@cf/openai/gpt-oss-20b": {in: 18182, out: 27273}
    "@cf/qwen/qwen3.8-27b": {in: 40909, out: 290909}
    "@cf/baai/bge-m3": {in: 1075, out: 0}
    default: {in: 40909, out: 290909}
  # Extra request fields per model. gpt-oss models "think" first and thinking tokens are billed as output:
  # low effort keeps extraction and checks cheap. A model that rejects a field is asked again without it.
  model_params:
    "@cf/openai/gpt-oss-20b": {reasoning_effort: low}
  retry: {max_retries: 3, base_delay_s: 5, max_delay_s: 40}   # 429: the next account is tried at once; only the last one waits
