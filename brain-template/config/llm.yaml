# LLM routing. Never hard-code model IDs in code: they live here and are verified against each
# provider's models endpoint at startup (`python -m newsbot health`). Every ID below is # VERIFY.
# Chains are tried in order; a provider is used only if its key exists (Groq first).
# Kept deliberately small: one small and one strong model on Groq, Workers AI 70B as the strong fallback,
# and the embedding model. (Gemini and a small Workers AI model were removed: fewer IDs that can go stale.)
llm:
  tasks: {extract: small, verify: strong, write_bn: strong, write_en: strong, qa_check: small}
  tiers:
    small:
      - {provider: groq, model: "openai/gpt-oss-20b"}                        # VERIFY
    strong:
      - {provider: groq, model: "openai/gpt-oss-120b"}                       # VERIFY
      - {provider: workers_ai, model: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"}   # VERIFY
  embedding: {provider: workers_ai, model: "@cf/baai/bge-m3"}                # VERIFY multilingual (bn) support
  budget:
    stop_fraction: 0.9            # stop LLM work and queue stories at 90% of a limit
    # keys: "provider" (sum of its models) or "provider/model" (wins over provider). VERIFY all limits.
    tokens_per_day:
      "groq/openai/gpt-oss-120b": 180000
      "groq/openai/gpt-oss-20b": 180000
      workers_ai: 150000           # rough proxy for the free neuron allowance
    requests_per_day:
      groq: 900
  retry: {max_retries: 3, base_delay_s: 2, max_delay_s: 60}   # also honours Retry-After on 429
