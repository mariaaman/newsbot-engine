# Hugo site config. Per-deploy values (name, base URL, ads, disclosure text) come from the brain config:
#   python scripts/gen_site_config.py --brain <brain>  ->  site/data/site.yaml, static/ads.txt, static/robots.txt
#   hugo --minify -s site --baseURL "$(python scripts/gen_site_config.py --brain <brain> --print-base-url)"
baseURL: "https://example.pages.dev/"   # placeholder; overridden with --baseURL
title: "NewsBot"                        # placeholder; templates use data/site.yaml name
defaultContentLanguage: bn
defaultContentLanguageInSubdir: true    # /bn/ and /en/; the root only redirects (and serves static/404.html)
disableDefaultLanguageRedirect: false
languages:
  bn:
    languageName: "বাংলা"
    languageCode: bn-BD
    weight: 1
    contentDir: content/bn
  en:
    languageName: English
    languageCode: en
    weight: 2
    contentDir: content/en
# Taxonomies: categories ONLY (no tags, no per-day archives) to stay far below the 20,000-file limit.
taxonomies:
  category: categories
disableKinds: [section]                 # no section list pages; sitemap/RSS/404 kinds stay enabled
enableRobotsTXT: false                  # static/robots.txt is generated from config
canonifyURLs: false
buildFuture: true                       # never skip an article whose timestamp is slightly ahead of the runner clock
enableGitInfo: false
timeZone: "Asia/Dhaka"
rssLimit: 20
pagination:
  pagerSize: 20
outputs:                                # feeds only for home and category pages
  home: [HTML, RSS]
  term: [HTML, RSS]
  taxonomy: [HTML]
  page: [HTML]
sitemap:
  changefreq: hourly
  priority: 0.5
  filename: sitemap.xml
markup:
  goldmark:
    extensions:
      linkify: false                    # bare www./http text is never turned into a link (VERIFY key name)
    renderer:
      unsafe: false                     # raw HTML in article Markdown is dropped (injection defence)
  highlight:
    noClasses: false
minify:
  tdewolff:
    html:
      keepWhitespace: false
params:
  description: ""
