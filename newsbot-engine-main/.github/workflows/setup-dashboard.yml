name: setup-dashboard
# One click: deploy the NewsBot dashboard Worker to Cloudflare (docs/DASHBOARD.md). Safe to run again; every run signs everybody out.
# Needs repository secrets: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit + Workers KV Storage: Edit), CLOUDFLARE_ACCOUNT_ID,
# DASHBOARD_PASSWORD (14+ characters, your choice) and DASHBOARD_GH_TOKEN (fine-grained token, see the guide). TELEGRAM_* are optional (the address is sent to you).
# The log is public: status words only, never the Worker address or any secret.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: setup-dashboard
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BRAIN_REPO: ${{ vars.BRAIN_REPO }}
      BRAIN_BRANCH: ${{ vars.BRAIN_BRANCH || 'main' }}
    steps:
      - name: Checkout engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Run the dashboard tests
        run: node --test dashboard/test/*.test.mjs
      - name: Check inputs and prepare the KV namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          DASHBOARD_GH_TOKEN: ${{ secrets.DASHBOARD_GH_TOKEN }}
        run: python scripts/setup_dashboard.py prepare
      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: dashboard
        run: |
          if npx --yes wrangler@4 deploy --var "BRAIN_REPO:$BRAIN_REPO" --var "ENGINE_REPO:$GITHUB_REPOSITORY" --var "BRAIN_BRANCH:$BRAIN_BRANCH" > "$RUNNER_TEMP/wrangler.log" 2>&1; then   # VERIFY wrangler major version and flags
            echo "worker deploy: ok"
          else
            sed -E 's#https://[A-Za-z0-9./_-]*workers\.dev[A-Za-z0-9./_-]*#<address hidden>#g' "$RUNNER_TEMP/wrangler.log" | tail -40
            echo "worker deploy: failed"
            exit 1
          fi
      - name: Secrets and check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          DASHBOARD_GH_TOKEN: ${{ secrets.DASHBOARD_GH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/setup_dashboard.py secrets
