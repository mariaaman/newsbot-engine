name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: bash -n scripts/brain_commit.sh
      - name: Test the Telegram approve Worker (plain Node, no dependencies)
        run: node --test worker/test.mjs
      - name: Test the dashboard (plain Node, no dependencies)
        run: node --test dashboard/test/*.test.mjs
      - run: python -m newsbot run --mode dry-run --brain brain-template
      - name: Install Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78  # v3
        with:
          hugo-version: "0.139.0"          # VERIFY current Hugo extended version
          extended: true
      - name: Hugo build (sample content, both languages)
        run: |
          python scripts/gen_site_config.py --brain brain-template
          hugo --minify -s site --baseURL "$(python scripts/gen_site_config.py --brain brain-template --print-base-url)"
          python scripts/check_file_count.py site/public
