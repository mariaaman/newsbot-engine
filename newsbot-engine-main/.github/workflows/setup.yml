name: setup
# Manual one-click setup check. Prints only "OK name" / "FAIL name" / "SKIP name" lines, never values.
# Creates the Cloudflare Pages project when it is missing.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: newsbot-setup
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Checkout brain (private)
        continue-on-error: true                        # a failure here is reported by the check below
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: ${{ vars.BRAIN_REPO }}
          token: ${{ secrets.BRAIN_REPO_TOKEN }}
          path: brain
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install engine
        run: pip install -e .
      - name: Collect LLM accounts
        id: llm_accounts
        env:
          ALL_SECRETS_JSON: ${{ toJSON(secrets) }}
        run: python scripts/collect_llm_accounts.py
      - name: Secrets, variables, brain repo, Cloudflare, Pages project, Workers AI
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRAIN_REPO_TOKEN: ${{ secrets.BRAIN_REPO_TOKEN }}
          BRAIN_REPO: ${{ vars.BRAIN_REPO }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
          PUBLISH_MODE: ${{ vars.PUBLISH_MODE }}
        run: python scripts/setup_check.py brain
      - name: Brain config is valid
        if: always()
        run: python -m newsbot validate --brain brain
      - name: Model IDs exist on every Cloudflare LLM account
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m newsbot health --brain brain
      - name: Live test - which providers really answer (tiny JSON call + a realistic Bengali/Japanese extraction)
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m newsbot llmtest --brain brain
