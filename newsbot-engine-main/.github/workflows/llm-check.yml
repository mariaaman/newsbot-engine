name: llm-check
# Checks EVERY Cloudflare LLM account of the pool (token, model catalogue, one tiny real call per model + one embedding)
# and writes the result to state/llm_health.json in the private brain repo, where the dashboard shows it.
# Started from the dashboard ("এখনই যাচাই") or by hand. Prints only labels and status words, never a value.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: newsbot-llm-check
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Checkout brain (private)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: ${{ vars.BRAIN_REPO }}
          token: ${{ secrets.BRAIN_REPO_TOKEN }}
          path: brain
          ref: ${{ vars.BRAIN_BRANCH || 'main' }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install engine
        run: pip install -e .
      - name: Collect LLM accounts
        id: llm_accounts
        env:
          ALL_SECRETS_JSON: ${{ toJSON(secrets) }}
        run: python scripts/collect_llm_accounts.py
      - name: Check every account
        id: check
        continue-on-error: true
        run: python -m newsbot llmcheck --brain brain
      - name: Save the result in the brain repo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.BRAIN_REPO_TOKEN }}
          BRAIN_BRANCH: ${{ vars.BRAIN_BRANCH || 'main' }}
        run: bash scripts/brain_commit.sh brain state
      - name: Result
        if: always()
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        run: |
          echo "llm-check: $CHECK_OUTCOME"
          test "$CHECK_OUTCOME" = "success"
