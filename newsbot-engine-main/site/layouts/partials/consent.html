{{- /* Consent hook: only when ads are on AND ads.consent_required. Ads load only after "accept". */ -}}
{{- $d := site.Data.site -}}
{{- if and (partial "adson.html" .) $d.ads.consent_required }}
<div id="consent" class="consent" role="dialog" aria-live="polite" hidden>
<p>{{ i18n "consent_text" }}</p>
<button type="button" id="consent-yes">{{ i18n "consent_accept" }}</button>
<button type="button" id="consent-no">{{ i18n "consent_decline" }}</button>
</div>
<script>
(function(){var K="newsbot-consent",b=document.getElementById("consent"),v=null;
{{- if eq $d.ads.network "adsterra" }}
function run(f){var sc=f.querySelectorAll("script");for(var i=0;i<sc.length;i++){var o=sc[i],n=document.createElement("script"),a;for(a=0;a<o.attributes.length;a++){n.setAttribute(o.attributes[a].name,o.attributes[a].value)}n.async=false;n.text=o.text;o.parentNode.replaceChild(n,o);}return f;}
function load(){var u=[{{ range $d.ads.scripts }}"{{ . }}",{{ end }}],i,s,t=document.querySelectorAll("template.ad-snippet");
for(i=0;i<u.length;i++){s=document.createElement("script");s.async=true;s.src=u[i];document.head.appendChild(s);}
for(i=0;i<t.length;i++){t[i].parentNode.insertBefore(run(t[i].content.cloneNode(true)),t[i]);}
}
{{- else }}
function load(){var s=document.createElement("script");s.async=true;s.crossOrigin="anonymous";s.src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-{{ $d.ads.publisher_id }}";document.head.appendChild(s);}
{{- end }}
function set(x){try{localStorage.setItem(K,x)}catch(e){}b.hidden=true;if(x==="yes")load();}
try{v=localStorage.getItem(K)}catch(e){}
if(v==="yes"){load()}else if(v!=="no"){b.hidden=false}
document.getElementById("consent-yes").onclick=function(){set("yes")};
document.getElementById("consent-no").onclick=function(){set("no")};})();
</script>
{{- end }}
