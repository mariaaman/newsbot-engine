name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: bash -n scripts/brain_commit.sh
      - run: python -m newsbot run --mode dry-run --brain brain-template
      - name: Install Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # peaceiris/actions-hugo v3.2.1
        with:
          hugo-version: "0.139.0"          # VERIFY current Hugo extended version
          extended: true
      - name: Hugo build (sample content, both languages)
        run: |
          python scripts/gen_site_config.py --brain brain-template
          hugo --minify -s site --baseURL "$(python scripts/gen_site_config.py --brain brain-template --print-base-url)"
          python scripts/check_file_count.py site/public
