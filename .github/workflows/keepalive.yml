name: keepalive
# GitHub may disable scheduled workflows after 60 days without repository activity (VERIFY the current rule).
# Once a month: a tiny commit on the default branch plus a re-enable call for the hourly workflow.
on:
  schedule:
    - cron: "23 5 1 * *"
  workflow_dispatch:
permissions:
  contents: write      # only this workflow writes; the hourly job stays read-only
  actions: write
concurrency:
  group: newsbot-keepalive
  cancel-in-progress: false
jobs:
  keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4                      # VERIFY: pin to a commit SHA before going live
      - name: Touch keepalive file and push
        run: |
          date -u +%Y-%m-%d > .github/keepalive
          git config user.name "newsbot"
          git config user.email "newsbot@users.noreply.github.com"
          git add .github/keepalive
          git diff --cached --quiet || { git commit -q -m "keepalive"; git push -q; }
      - name: Make sure the hourly workflow is enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow enable hourly.yml --repo "$GITHUB_REPOSITORY" || true
