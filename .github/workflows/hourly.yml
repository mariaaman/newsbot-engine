name: hourly
# Every hour: discover -> score -> (usually nothing to do) -> write -> commit to the private brain repo -> build -> deploy.
# Public repo: logs show only counts, story ids and status words. Secrets are passed per step through env only.
on:
  schedule:
    - cron: "17 * * * *"           # minute 17 avoids the busy top of the hour; VERIFY the GitHub 60-day schedule rule (keepalive.yml)
  workflow_dispatch:
    inputs:
      mode:
        description: "auto | review | dry-run (empty = the PUBLISH_MODE variable, default review)"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: newsbot-hourly
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODE: ${{ inputs.mode || vars.PUBLISH_MODE || 'review' }}
      PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
      BRAIN_BRANCH: ${{ vars.BRAIN_BRANCH || 'main' }}
    steps:
      - name: Check mode
        id: check_mode
        run: |
          case "$MODE" in auto|review|dry-run) ;; *) echo "bad mode"; exit 2 ;; esac
      - name: Checkout engine
        id: checkout_engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Checkout brain (private)
        id: checkout_brain
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: ${{ vars.BRAIN_REPO }}
          token: ${{ secrets.BRAIN_REPO_TOKEN }}
          path: brain
          ref: ${{ vars.BRAIN_BRANCH || 'main' }}
          fetch-depth: 1
      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install engine
        id: install
        run: pip install -e .
      - name: Collect LLM accounts
        id: llm_accounts
        env:
          CFLLM_ACCOUNTS: ${{ secrets.CFLLM_ACCOUNTS }}
        run: python scripts/collect_llm_accounts.py
      - name: Run engine
        id: run
        timeout-minutes: 25          # the engine ends itself at limits.max_run_minutes; this only catches a hang, so the commit and notify steps below still get their turn
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m newsbot run --mode "$MODE" --brain brain --report "$RUNNER_TEMP/run_report.json"
      - name: Remove the LLM accounts file (it holds API tokens; no later step needs it)
        if: always()
        run: rm -f "${NEWSBOT_CF_ACCOUNTS_FILE:-/nonexistent}"
      - name: Commit to brain (state, drafts, content or review PR)
        id: commit
        # always(): a run that crashed or hit the step timeout must still save what it learned (daily-allowance counters, fact sheets,
        # cool-downs and above all state/diagnostics, which names the failing stage). Without this, a failing run left NO trace in the
        # brain and the next run repeated the same expensive calls with a counter that had forgotten them.
        if: always() && env.MODE != 'dry-run' && steps.checkout_brain.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.BRAIN_REPO_TOKEN }}
        run: |
          export NEWSBOT_PR_URL_FILE="$RUNNER_TEMP/pr_url.txt"
          bash scripts/brain_commit.sh brain "$MODE"
      - name: Is a deploy needed?
        id: plan
        if: env.MODE != 'dry-run'
        run: python -m newsbot deploy-needed --brain brain >> "$GITHUB_OUTPUT"
      - name: Install Hugo
        id: hugo
        if: steps.plan.outputs.deploy == 'true'
        run: bash scripts/install_hugo.sh 0.139.0          # retries on GitHub 504s
      - name: Turn on free visitor counting (best effort)
        if: steps.plan.outputs.deploy == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/ensure_analytics.py --brain brain
      - name: Build site
        id: build
        if: steps.plan.outputs.deploy == 'true'
        run: python scripts/build_sites.py --brain brain          # one site, or one per language (site.sites); each build is size-checked
      - name: Cache npm (wrangler)
        if: steps.plan.outputs.deploy == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.npm
          key: npm-wrangler-${{ runner.os }}-v1
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.plan.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/deploy_sites.py          # runs wrangler@4 pages deploy for every site in the build manifest
      - name: Record deploy in brain state
        id: record
        if: steps.plan.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.BRAIN_REPO_TOKEN }}
        run: |
          python -m newsbot mark-deployed --brain brain
          bash scripts/brain_commit.sh brain state
      - name: Notify Telegram (every step result and review requests; never fails the run)
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRAIN_REPO: ${{ vars.BRAIN_REPO }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PYTHONPATH: ${{ github.workspace }}
          STEP_OUTCOMES: >-
            check_mode=${{ steps.check_mode.outcome }},checkout_engine=${{ steps.checkout_engine.outcome }},checkout_brain=${{ steps.checkout_brain.outcome }},setup_python=${{ steps.setup_python.outcome }},install=${{ steps.install.outcome }},llm_accounts=${{ steps.llm_accounts.outcome }},run=${{ steps.run.outcome }},commit=${{ steps.commit.outcome }},plan=${{ steps.plan.outcome }},hugo=${{ steps.hugo.outcome }},build=${{ steps.build.outcome }},deploy=${{ steps.deploy.outcome }},record=${{ steps.record.outcome }}
        run: python -m newsbot notify --brain brain --workflow hourly --report "$RUNNER_TEMP/run_report.json" --pr-url-file "$RUNNER_TEMP/pr_url.txt"
