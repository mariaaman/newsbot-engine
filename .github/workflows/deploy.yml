name: deploy
# Publishes what is already in the private brain repo: build the site and deploy it to Cloudflare Pages. No models, no news.
# Started by the Telegram approve Worker right after you approve a draft (docs/TELEGRAM_APPROVE.md), or by hand.
# Shares the hourly concurrency group, so the two never touch the brain state at the same time. If a newer run replaces
# a waiting one, nothing is lost: every run builds the brain's current main.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: newsbot-hourly
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
    steps:
      - name: Checkout engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Checkout brain (private)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: ${{ vars.BRAIN_REPO }}
          token: ${{ secrets.BRAIN_REPO_TOKEN }}
          path: brain
          ref: ${{ vars.BRAIN_BRANCH || 'main' }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install engine
        run: pip install -e .
      - name: Is a deploy needed?
        id: plan
        run: python -m newsbot deploy-needed --brain brain >> "$GITHUB_OUTPUT"
      - name: Install Hugo
        if: steps.plan.outputs.deploy == 'true'
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78  # v3
        with:
          hugo-version: "0.139.0"                      # VERIFY current Hugo extended version (same as ci.yml and hourly.yml)
          extended: true
      - name: Build site
        if: steps.plan.outputs.deploy == 'true'
        run: |
          python scripts/gen_site_config.py --brain brain --sync-content
          hugo --minify -s site --baseURL "$(python scripts/gen_site_config.py --brain brain --print-base-url)"
      - name: Check file count (a failure blocks the deploy)
        if: steps.plan.outputs.deploy == 'true'
        run: python scripts/check_file_count.py site/public
      - name: Cache npm (wrangler)
        if: steps.plan.outputs.deploy == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.npm
          key: npm-wrangler-${{ runner.os }}-v1
      - name: Deploy to Cloudflare Pages
        if: steps.plan.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy site/public --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true   # VERIFY wrangler major version and flags
      - name: Record deploy in brain state
        if: steps.plan.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.BRAIN_REPO_TOKEN }}
        run: |
          python -m newsbot mark-deployed --brain brain
          bash scripts/brain_commit.sh brain state
