name: readiness
# Manual go-live scorecard: full tests, config, models (live), dry-run, Hugo build, brain state, recent runs, review-PR stats.
# Prints only counts and status words (the repo is public). Run it, then read the last step ("Scorecard").
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: newsbot-readiness
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false
      - name: Checkout brain (private)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          repository: ${{ vars.BRAIN_REPO }}
          token: ${{ secrets.BRAIN_REPO_TOKEN }}
          path: brain
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install engine with test tools
        run: pip install -e ".[dev]"
      - name: Full test suite
        id: tests
        continue-on-error: true
        run: pytest -q
      - name: Brain config validates
        id: validate
        continue-on-error: true
        run: python -m newsbot validate --brain brain
      - name: Model IDs exist at the providers
        id: health
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m newsbot health --brain brain
      - name: Live model test
        id: llmtest
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m newsbot llmtest --brain brain
      - name: Dry run on the real brain config (fixtures and a mock model, nothing written)
        id: dryrun
        continue-on-error: true
        run: python -m newsbot run --mode dry-run --brain brain
      - name: Install Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # peaceiris/actions-hugo v3.2.1
        with:
          hugo-version: "0.139.0"                      # VERIFY current Hugo extended version (same as ci.yml)
          extended: true
      - name: Hugo build with the brain content
        id: build
        continue-on-error: true
        run: |
          python scripts/gen_site_config.py --brain brain --sync-content
          hugo --minify -s site --baseURL "$(python scripts/gen_site_config.py --brain brain --print-base-url)"
      - name: File count
        id: filecount
        continue-on-error: true
        run: python scripts/check_file_count.py site/public
      - name: Scorecard
        if: always()
        env:
          STEP_OUTCOMES: >-
            tests=${{ steps.tests.outcome }},validate=${{ steps.validate.outcome }},health=${{ steps.health.outcome }},llmtest=${{ steps.llmtest.outcome }},dryrun=${{ steps.dryrun.outcome }},build=${{ steps.build.outcome }},filecount=${{ steps.filecount.outcome }}
          RUN_REPO: ${{ github.repository }}
          RUN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRAIN_REPO: ${{ vars.BRAIN_REPO }}
          GH_TOKEN: ${{ secrets.BRAIN_REPO_TOKEN }}
        run: python scripts/readiness.py brain
