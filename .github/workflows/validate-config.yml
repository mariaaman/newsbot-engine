name: validate-config
# Checks the brain's config with the engine's own validator. The dashboard starts it after every settings change
# (docs/DASHBOARD.md); a red run means the last change is invalid, so restore the previous version from the dashboard's file history.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-config
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4                      # VERIFY: pin to a commit SHA before going live
        with:
          persist-credentials: false
      - name: Checkout brain (private)
        uses: actions/checkout@v4                      # VERIFY: pin to a commit SHA before going live
        with:
          repository: ${{ vars.BRAIN_REPO }}
          token: ${{ secrets.BRAIN_REPO_TOKEN }}
          path: brain
          ref: ${{ vars.BRAIN_BRANCH || 'main' }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5                  # VERIFY: pin to a commit SHA before going live
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install engine
        run: pip install -e .
      - name: Validate the brain config
        run: python -m newsbot validate --brain brain
